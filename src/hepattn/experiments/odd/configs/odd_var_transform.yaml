# ODD Variable Transformation Configuration
# TODO: Fill in statistics from your data (compute using data analysis script)
#
# Each variable can have:
#   type: transformation type
#     - "std": standardization (x - mean) / std
#     - "min_max_sym": symmetric min-max to [-1, 1]
#     - "min_max": standard min-max to [0, 1]
#   fn: optional pre-transform function ("sqrt", "log", "log1p")
#   mean, std, min, max: statistics from your data

# =============================================================================
# Track Features
# =============================================================================

d0:
  type: min_max_sym
  # TODO: Compute from your data
  mean: 0.0
  std: 1.0
  min: -50.0
  max: 50.0

z0:
  type: min_max_sym
  # TODO: Compute from your data
  mean: 0.0
  std: 10.0
  min: -500.0
  max: 500.0

theta:
  type: min_max_sym
  # theta typically in [0, pi]
  mean: 1.57
  std: 0.5
  min: 0.0
  max: 3.14159

qop:
  type: std
  # q/p (charge over momentum)
  # TODO: Compute from your data
  mean: 0.0
  std: 0.1
  min: -1.0
  max: 1.0

# =============================================================================
# Cluster Features
# =============================================================================

cluster_energy:
  type: min_max_sym
  fn: sqrt
  # TODO: Compute from your data
  mean: 1.0
  std: 2.0
  min: 0.01
  max: 100.0

cluster_cx:
  type: min_max_sym
  # TODO: Compute from your data
  mean: 0.0
  std: 1000.0
  min: -3000.0
  max: 3000.0

cluster_cy:
  type: min_max_sym
  # TODO: Compute from your data
  mean: 0.0
  std: 1000.0
  min: -3000.0
  max: 3000.0

cluster_cz:
  type: min_max_sym
  # TODO: Compute from your data
  mean: 0.0
  std: 2000.0
  min: -4000.0
  max: 4000.0

# =============================================================================
# Common Features (derived)
# =============================================================================

eta:
  type: min_max_sym
  # pseudorapidity
  mean: 0.0
  std: 2.0
  min: -4.0
  max: 4.0

