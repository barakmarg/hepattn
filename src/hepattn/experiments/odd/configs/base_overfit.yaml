# ODD Particle Flow Base Configuration - Adapted to CLIC v6 Architecture
# TODO: Adjust paths, hyperparameters, and model architecture for your use case

name: odd_pflow_v1_clic_arch
seed_everything: 42

# =============================================================================
# Data Configuration
# =============================================================================
data:
  # Input features for nodes (tracks + clusters) - KEPT ODD SETTINGS
  inputs:
    node:
      - "d0"
      - "z0"
      - "phi"
      - "theta"
      - "qop"
      - "energy"
      - "eta"
      - "is_track"
      # TODO: Add more features as needed

  # Target variables for regression
  targets:
    particle:
      - e
      - pt
      - eta
      - sinphi
      - cosphi

  # Maximum number of output particles
  num_objects: &num_particles 450

  # TODO: Update paths to your parquet files, seperate for train/val/test
  train_path: /storage/agrp/barakma/PileupODD/data/train
  valid_path: /storage/agrp/barakma/PileupODD/data/train
  test_path: /storage/agrp/barakma/PileupODD/data/train

  # DataLoader settings - MATCHED CLIC SETTINGS (Higher batch/workers)
  num_workers: 2
  num_train: 32      # -1 for all events
  num_test: 32
  num_val: 32

  batch_size: 32    # Increased from 128 to match CLIC
  incidence_cutval: 0.01

  # Path to variable transformation config
  scale_dict_path: &scale_dict_path /storage/agrp/barakma/hepattn/src/hepattn/experiments/odd/configs/odd_var_transform.yaml

  # TODO: Adjust max_nodes based on your data
  max_nodes: 600

# =============================================================================
# Trainer Configuration
# =============================================================================
trainer:
  max_epochs: 2500
  accelerator: gpu
  devices: 1
  precision: 32-true #bf16-mixed
  gradient_clip_val: 0.1
  log_every_n_steps: 50
  default_root_dir: logs
  enable_progress_bar: True

  # TODO: Configure your logger
  logger:
    class_path: hepattn.experiments.odd.logger_utils.FixedCometLogger
    init_args:
      project: odd-pflow

  callbacks:
    - class_path: hepattn.callbacks.Compile
    - class_path: hepattn.callbacks.InferenceTimer
    - class_path: hepattn.callbacks.SaveConfig
    - class_path: hepattn.callbacks.Checkpoint
      init_args:
        monitor: val/loss
        save_last: true
    - class_path: hepattn.experiments.odd.PflowPredictionWriter
    - class_path: lightning.pytorch.callbacks.ModelSummary
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
    - class_path: lightning.pytorch.callbacks.TQDMProgressBar
      init_args:
        refresh_rate: 50

# =============================================================================
# Model Configuration
# =============================================================================
model:
  optimizer: AdamW  # Changed from AdamW to match CLIC

  lrs_config:
    initial: 3e-4
    #max: 8e-5
    #end: 1e-6
    #pct_start: 0.05
    weight_decay: 0
    #initial: 3e-4   
    skip_scheduler: true

  mtl: false

  model:
    class_path: hepattn.models.MaskFormer
    init_args:
      dim: &dim 256

      # Raw variables passed through for inference/analysis
      # KEPT ODD NAMES (needed for the Regression Task input calculation)
      raw_variables:
        - "node_e"
        - "node_pt"
        - "node_eta"
        - "node_sinphi"
        - "node_cosphi"
        - "node_is_track"
        # Total raw vars = 6. 
        # Regression input size = (2 * dim) + 6 = 512 + 6 = 518. 
        # This matches the CLIC network size.

      # Input network configuration
      input_nets:
        class_path: torch.nn.ModuleList
        init_args:
          modules:
            - class_path: hepattn.models.InputNet
              init_args:
                input_name: node
                fields:
                  - features
                net:
                  class_path: hepattn.models.Dense
                  init_args:
                    # TODO: Ensure this matches your ODD input feature count (8 in list above)
                    # Keeping 20 as per your original file, assuming padding or extra features.
                    input_size: 21 
                    output_size: *dim
                posenc:
                  class_path: hepattn.models.posenc.FourierPositionEncoder
                  init_args:
                    input_name: node
                    dim: *dim
                    fields: [eta, phi]
                    scale: 0.1

      # Encoder (transformer) configuration
      encoder:
        class_path: hepattn.models.Encoder
        init_args:
          num_layers: 6
          dim: *dim
          attn_type: torch #flash-varlen
          hybrid_norm: true
          value_residual: true
          num_register_tokens: 8
          attn_kwargs:
            num_heads: 16

      # Decoder configuration
      decoder:
        num_decoder_layers: 4
        num_queries: *num_particles
        mask_attention: true
        use_query_masks: false
        decoder_layer_config:
          dim: *dim
          hybrid_norm: true
          attn_kwargs:
            num_heads: 16

      # Hungarian matcher for set prediction
      matcher:
        class_path: hepattn.models.matcher.Matcher
        init_args:
          default_solver: scipy
          adaptive_solver: false
          parallel_solver: true
          n_jobs: 16

      # Task heads - UPDATED TO MATCH CLIC
      tasks:
        class_path: torch.nn.ModuleList
        init_args:
          modules:
            # 1. Classification task
            - class_path: hepattn.models.task.ObjectClassificationTask
              init_args:
                name: classification
                input_object: query
                output_object: pflow
                target_object: particle
                num_classes: 5
                losses:
                  object_ce: 2
                costs:
                  object_ce: 2
                net:
                  class_path: hepattn.models.Dense
                  init_args:
                    input_size: *dim
                    activation: torch.nn.SiLU
                    output_size: 6
                    hidden_layers: [256, 128, 32]
                null_weight: 0.5
                loss_class_weights: [1.0, 3.0, 8.0, 1.5, 1.0]
                mask_queries: false
                has_intermediate_loss: true

            # 2. Mask task
            - class_path: hepattn.models.task.ObjectHitMaskTask
              init_args:
                name: mask
                input_hit: node
                input_object: query
                output_object: pflow
                target_object: particle
                pred_threshold: 0.1
                logit_scale: 4
                losses:
                  mask_bce: 5.0
                  mask_dice: 1.0
                costs:
                  # mask_bce: 5.0  (Commented out in CLIC, usually expensive for matching)
                  mask_dice: 1.0
                dim: *dim
                null_weight: 1.0
                has_intermediate_loss: true

            # 3. Incidence Regression (Added from CLIC)
            - class_path: hepattn.models.task.IncidenceRegressionTask
              init_args:
                name: incidence
                input_hit: node
                input_object: query
                output_object: pflow
                target_object: particle
                losses:
                  kl_div: 1.0
                costs:
                  kl_div: 1.0
                net:
                  class_path: hepattn.models.Dense
                  init_args:
                    input_size: *dim
                    activation: torch.nn.SiLU
                    output_size: *dim
                    hidden_layers: [*dim, *dim]
                node_net:
                  class_path: hepattn.models.Dense
                  init_args:
                    input_size: *dim
                    output_size: *dim
                    hidden_layers: [*dim]
                has_intermediate_loss: false

            # 4. Incidence Based Regression (Added from CLIC)
            - class_path: hepattn.models.task.IncidenceBasedRegressionTask
              init_args:
                name: regression
                fields: ["e", "pt", "eta", "sinphi", "cosphi"]
                input_hit: node
                input_object: query
                output_object: pflow
                target_object: particle
                loss: l1
                loss_weight: 10.0
                cost_weight: 10.0
                use_incidence: true
                use_nodes: true
                cost: new
                mode: scale
                scale_dict_path: *scale_dict_path
                net:
                  class_path: hepattn.models.Dense
                  init_args:
                    # Input size = (Dim * 2) + Num_Raw_Variables
                    # 256 * 2 + 6 = 518 (Matches CLIC size)
                    input_size: 518
                    activation: torch.nn.SiLU
                    output_size: 5
                    hidden_layers: [512, 256, 128, 64, 32]
                has_intermediate_loss: false
