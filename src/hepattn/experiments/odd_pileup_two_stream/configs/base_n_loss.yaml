# ODD Two-Stream Causally-Conditioned Hybrid Query MaskFormer
# Stream A: Track MaskFormer (isolated, protects Track F1)
# Stream B: Calo MaskFormer (hybrid queries from HS tracks + global neutral query)

name: odd_pflow_two_stream
seed_everything: 42

# =============================================================================
# Data Configuration (same as single-stream baseline)
# =============================================================================
data:
  inputs:
    node:
      - "d0"
      - "z0"
      - "phi"
      - "theta"
      - "qop"
      - "energy"
      - "eta"
      - "is_track"

  targets:
    particle:
      - e
      - pt
      - eta
      - sinphi
      - cosphi

  train_path: /storage/agrp/barakma/PileupODD/data/fervefvef
  valid_path: /storage/agrp/barakma/PileupODD/data/vdfvdfdfv
  test_path: /storage/agrp/barakma/PileupODD/data/vfdfvdf

  unify_path: /storage/agrp/barakma/PileupODD/data/ttbar_pu200
  enable_split: true
  train_split: 0.9
  val_split: 0.1
  test_split: 0.1
  val_and_test_split_same: true
  overtrain: false

  num_workers: 4
  num_val_workers: 1
  num_test_workers: 1
  num_train: 1000
  num_test: 1000
  num_val: 1000

  batch_size: 48
  incidence_cutval: 0.01
  hard_scatter_energy_threshold: 0.1

  scale_dict_path: &scale_dict_path /storage/agrp/barakma/hepattn/src/hepattn/experiments/odd_pileup_maskformer/configs/odd_var_transform.yaml
  max_nodes: 5500
  window_size: 256

# =============================================================================
# Trainer Configuration
# =============================================================================
trainer:
  max_epochs: 100
  accelerator: gpu
  devices: 1
  precision: bf16-mixed
  gradient_clip_val: 0.1
  log_every_n_steps: 50
  default_root_dir: logs
  enable_progress_bar: True

  logger:
    class_path: hepattn.experiments.odd_pileup_maskformer.logger_utils.FixedCometLogger
    init_args:
      project: odd-pflow-two-stream

  callbacks:
    - class_path: hepattn.callbacks.Compile
    - class_path: hepattn.callbacks.InferenceTimer
    - class_path: hepattn.callbacks.SaveConfig
    - class_path: hepattn.callbacks.Checkpoint
      init_args:
        monitor: val/loss
        save_last: true
    - class_path: hepattn.experiments.odd_pileup_maskformer.PflowPredictionWriter
    - class_path: lightning.pytorch.callbacks.ModelSummary
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
    - class_path: lightning.pytorch.callbacks.TQDMProgressBar
      init_args:
        refresh_rate: 50

# =============================================================================
# Model Configuration — Two-Stream MaskFormer
# =============================================================================
model:
  optimizer: AdamW

  lrs_config:
    initial: 1.25e-6
    max: 1e-4
    end: 1.25e-6
    pct_start: 0.05
    weight_decay: 0.01
    skip_scheduler: false

  mtl: false

  model:
    class_path: hepattn.experiments.odd_pileup_two_stream.model.TwoStreamMaskFormer
    init_args:
      dim: &dim 256
      target_object: particle
      max_hs_tracks: 190
      teacher_forcing: true

      # Raw variables forwarded through x dict
      raw_variables:
        - "node_e"
        - "node_is_track"
        - "tracks_mask"

      # Input network: embed all nodes (tracks + clusters) into dim-D space
      input_nets:
        class_path: torch.nn.ModuleList
        init_args:
          modules:
            - class_path: hepattn.models.InputNet
              init_args:
                input_name: node
                fields:
                  - features
                net:
                  class_path: hepattn.models.Dense
                  init_args:
                    input_size: 21
                    output_size: *dim
                posenc:
                  class_path: hepattn.models.posenc.FourierPositionEncoder
                  init_args:
                    input_name: node
                    dim: *dim
                    fields: [eta, phi]
                    scale: 0.1

      # Sort field for windowed attention
      input_sort_field: deltaR_idx

      # Shared encoder: windowed attention over all nodes
      encoder:
        class_path: hepattn.models.Encoder
        init_args:
          num_layers: 8
          dim: *dim
          attn_type: flash-varlen
          window_size: 256
          window_wrap: false
          hybrid_norm: true
          value_residual: true
          attn_kwargs:
            num_heads: 16

      # =====================================================================
      # Stream A: Track Decoder + Tasks
      # =====================================================================
      track_decoder:
        class_path: hepattn.experiments.odd_pileup_maskformer.decoder.PileupMaskFormerDecoder
        init_args:
          prior_mask_key: "node_is_track"
          num_decoder_layers: 4
          num_queries: 1
          mask_attention: true
          use_query_masks: false
          decoder_layer_config:
            dim: *dim
            hybrid_norm: true
            bidirectional_ca: true
            attn_kwargs:
              num_heads: 16

      track_tasks:
        class_path: torch.nn.ModuleList
        init_args:
          modules:
            # Task 1: Iterative learnable attention mask (MaskFormer core)
            # Target: particle_node_valid (True for HS tracks only)
            - class_path: hepattn.models.task.ObjectHitMaskTask
              init_args:
                name: mask
                input_hit: node
                input_object: query
                output_object: pflow
                target_object: particle
                pred_threshold: 0.5
                logit_scale: 4
                losses:
                  mask_bce: 5.0
                  mask_dice: 1.0
                costs: {}
                dim: *dim
                null_weight: 0.06
                has_intermediate_loss: true

            # Task 2: Vertex z regression from query embedding
            - class_path: hepattn.models.task.ObjectRegressionTask
              init_args:
                name: vz_regression
                input_object: query
                output_object: pflow
                target_object: particle
                fields: [vz]
                loss_weight: 0.01179
                cost_weight: 0.0
                dim: *dim
                loss: smooth_l1
                has_intermediate_loss: false

      # =====================================================================
      # Stream B: Calo Decoder + Tasks
      # =====================================================================
      calo_decoder:
        class_path: hepattn.experiments.odd_pileup_two_stream.decoder.CaloFlashCrossAttentionDecoder
        init_args:
          dim: *dim
          num_decoder_layers: 4
          hybrid_norm: true
          attn_kwargs:
            num_heads: 16
            attn_type: flash-varlen

      calo_tasks:
        class_path: torch.nn.ModuleList
        init_args:
          modules:
            # Task 1: Calo HS mask with deep supervision (BCE + Dice)
            - class_path: hepattn.experiments.odd_pileup_two_stream.tasks.CaloHitMaskTask
              init_args:
                name: calo_mask
                input_hit: node
                input_object: query
                losses:
                  mask_bce: 5.0
                  mask_tversky: 2.0
                dim: *dim
                null_weight: 0.05
                logit_scale: 4
                pred_threshold: 0.2
                hs_energy_threshold: 0.15
                hs_frac_threshold: 0.05
                has_intermediate_loss: false

            # Task 2: Calo energy fraction regression (loss only on HS clusters)
            - class_path: hepattn.experiments.odd_pileup_two_stream.tasks.PileupCaloFractionTaskV2
              init_args:
                name: calo_fraction
                input_hit: node
                input_object: query
                dim: *dim
                loss_weight: 0.1
                signal_weight: 25.3
                hs_energy_threshold: 0.15
                hs_frac_threshold: 0.05
                has_intermediate_loss: false
