# ODD Particle Flow Base Configuration - Adapted to CLIC v6 Architecture
# TODO: Adjust paths, hyperparameters, and model architecture for your use case

name: odd_pflow_v1_clic_arch
seed_everything: 42

# =============================================================================
# Data Configuration
# =============================================================================
data:
  # Input features for nodes (tracks + clusters) - KEPT ODD SETTINGS
  inputs:
    node:
      - "d0"
      - "z0"
      - "phi"
      - "theta"
      - "qop"
      - "energy"
      - "eta"
      - "is_track"
      # TODO: Add more features as needed

  # Target variables for regression
  targets:
    particle:
      - e
      - pt
      - eta
      - sinphi
      - cosphi

  # TODO: Update paths to your parquet files, seperate for train/val/test
  train_path: /storage/agrp/barakma/PileupODD/data/fervefvef
  valid_path: /storage/agrp/barakma/PileupODD/data/vdfvdfdfv
  test_path: /storage/agrp/barakma/PileupODD/data/vfdfvdf
  
  unify_path: /storage/agrp/barakma/PileupODD/data/ttbar_pu200
  enable_split: true
  train_split: 0.9
  val_split: 0.1
  test_split: 0.1
  val_and_test_split_same: true
  overtrain: false # Enable overtraining for debugging (use same files for train/val/test), have priority over val_and_test_split_same

  # DataLoader settings - MATCHED CLIC SETTINGS (Higher batch/workers)
  num_workers: 4
  num_val_workers: 1
  num_test_workers: 1
  #prefetch_factor: 1
  num_train: -1   # -1 for all events
  num_test: -1
  num_val: -1

  batch_size: 64   # Increased from 128 to match CLIC
  incidence_cutval: 0.01

  # Energy threshold for cluster filtering
  hard_scatter_energy_threshold: 0.1

  # Path to variable transformation config
  scale_dict_path: &scale_dict_path /storage/agrp/barakma/hepattn/src/hepattn/experiments/odd_pileup_maskformer/configs/odd_var_transform.yaml

  # TODO: Adjust max_nodes based on your data
  max_nodes: 5500

# =============================================================================
# Trainer Configuration
# =============================================================================
trainer:
  max_epochs: 100
  accelerator: gpu
  devices: 1
  precision: bf16-mixed
  gradient_clip_val: 0.1
  log_every_n_steps: 50
  default_root_dir: logs
  enable_progress_bar: True

  # TODO: Configure your logger
  logger:
    class_path: hepattn.experiments.odd_pileup_maskformer.logger_utils.FixedCometLogger
    init_args:
      project: odd-pflow-pileup-removal

  callbacks:
    - class_path: hepattn.callbacks.Compile
    - class_path: hepattn.callbacks.InferenceTimer
    - class_path: hepattn.callbacks.SaveConfig
    - class_path: hepattn.callbacks.Checkpoint
      init_args:
        monitor: val/loss
        save_last: true
    - class_path: hepattn.experiments.odd_pileup_maskformer.PflowPredictionWriter
    - class_path: lightning.pytorch.callbacks.ModelSummary
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
    - class_path: lightning.pytorch.callbacks.TQDMProgressBar
      init_args:
        refresh_rate: 50

# =============================================================================
# Model Configuration — MaskFormer with Proxy PV Query
# =============================================================================
model:
  optimizer: AdamW

  lrs_config:
    initial: 1.25e-6
    max: 1e-4
    end: 1.25e-6
    pct_start: 0.05
    weight_decay: 0.01
    skip_scheduler: false

  mtl: false

  model:
    class_path: hepattn.models.MaskFormer
    init_args:
      dim: &dim 256
      target_object: particle
      matcher: null  # No Hungarian matching — single query = single hard scatter event

      # Raw variables forwarded through x dict for loss calculation
      raw_variables:
        - "node_e"
        - "node_is_track"

      # Input network: embed all nodes (tracks + clusters) into dim-D space
      input_nets:
        class_path: torch.nn.ModuleList
        init_args:
          modules:
            - class_path: hepattn.models.InputNet
              init_args:
                input_name: node
                fields:
                  - features
                net:
                  class_path: hepattn.models.Dense
                  init_args:
                    input_size: 21
                    output_size: *dim
                posenc:
                  class_path: hepattn.models.posenc.FourierPositionEncoder
                  init_args:
                    input_name: node
                    dim: *dim
                    fields: [eta, phi]
                    scale: 0.1

      # Sort field for windowed attention: Z-order Morton index in eta-phi
      input_sort_field: deltaR_idx

      # Encoder: windowed attention over all nodes
      encoder:
        class_path: hepattn.models.Encoder
        init_args:
          num_layers: 8
          dim: *dim
          attn_type: flash-varlen
          window_size: 256
          window_wrap: false
          hybrid_norm: true
          value_residual: true
          attn_kwargs:
            num_heads: 16

      # MaskFormer decoder with is_track physics prior on attention mask
      decoder:
        class_path: hepattn.experiments.odd_pileup_maskformer.decoder.PileupMaskFormerDecoder
        init_args:
          prior_mask_key: "node_is_track"
          num_decoder_layers: 4
          num_queries: 1
          mask_attention: true
          use_query_masks: false
          decoder_layer_config:
            dim: *dim
            hybrid_norm: true
            bidirectional_ca: true
            attn_kwargs:
              num_heads: 16

      # Task heads
      tasks:
        class_path: torch.nn.ModuleList
        init_args:
          modules:
            # Task 1: Iterative learnable attention mask (MaskFormer core)
            # Produces the cross-attention mask refined at each decoder layer.
            # Target: particle_node_valid (True for HS tracks only)
            - class_path: hepattn.models.task.ObjectHitMaskTask
              init_args:
                name: mask
                input_hit: node
                input_object: query
                output_object: pflow
                target_object: particle
                pred_threshold: 0.5
                logit_scale: 4
                losses:
                  mask_bce: 5.0
                  mask_dice: 1.0
                costs: {}
                dim: *dim
                null_weight: 0.06
                has_intermediate_loss: true

            # Task 2: Vertex z regression from query embedding
            # The query learns to encode the hard scatter vertex position
            - class_path: hepattn.models.task.ObjectRegressionTask
              init_args:
                name: vz_regression
                input_object: query
                output_object: pflow
                target_object: particle
                fields: [vz]
                loss_weight: 1.0
                cost_weight: 0.0
                dim: *dim
                loss: smooth_l1
                has_intermediate_loss: true

            # Task 3: Calo energy fraction regression (per-node, conditioned on query)
            - class_path: hepattn.experiments.odd_pileup_maskformer.tasks.PileupCaloFractionTask
              init_args:
                name: calo_fraction
                input_hit: node
                input_object: query
                dim: *dim
                loss_weight: 1.0
                signal_weight: 25.3
                signal_threshold: 0.05
                has_intermediate_loss: false